global:
  scrape_interval: 15s

scrape_configs:
  - job_name: costqual-api
    static_configs:
      # "api" is the containerized API service (Module 7's one-command
      # setup). If running the API on the host instead during development,
      # point this at host.docker.internal:8000.
      - targets: ["api:8000"]
