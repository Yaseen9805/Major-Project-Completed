name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: costqual
          POSTGRES_USER: costqual
          POSTGRES_PASSWORD: costqual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U costqual -d costqual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest runners come preloaded with several GB of toolchains
      # (.NET, Android SDK, Haskell, CodeQL, ...) this project never uses --
      # installing torch (via sentence-transformers) plus pulling Ollama
      # models filled the remaining disk without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply database schema
        run: |
          python -c "
          import db
          conn = db.get_connection()
          cur = conn.cursor()
          cur.execute(open('db/init.sql', encoding='utf-8').read())
          conn.commit()
          "

      # Only the small/medium tiers are pulled here -- mistral:7b is a ~4GB
      # download that would make every CI run slow. Tests that need the
      # large tier are marked @pytest.mark.requires_large_model and skipped
      # below; run those locally where the model is already pulled.
      - name: Install Ollama and pull lightweight models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b
          ollama pull phi3:mini

      - name: Run tests (excluding large-model tests)
        run: pytest -m "not requires_large_model" -q
