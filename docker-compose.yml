services:
  postgres:
    image: postgres:16-alpine
    container_name: costqual-postgres
    environment:
      POSTGRES_DB: costqual
      POSTGRES_USER: costqual
      POSTGRES_PASSWORD: costqual
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costqual -d costqual"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: costqual-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus:latest
    container_name: costqual-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: costqual-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  ollama:
    image: ollama/ollama:latest
    container_name: costqual-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job: pulls the 3 model tiers into the ollama volume, then
  # exits. Re-run (`docker compose up ollama-pull`) any time after a fresh
  # volume; already-pulled models are a no-op.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ollama pull qwen2.5:0.5b
        ollama pull phi3:mini
        ollama pull mistral:7b-instruct-q4_0
    environment:
      OLLAMA_HOST: "ollama:11434"

  api:
    build: .
    container_name: costqual-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: "postgresql://costqual:costqual@postgres:5432/costqual"
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_URL: "http://ollama:11434/api/generate"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  ollama_data:
